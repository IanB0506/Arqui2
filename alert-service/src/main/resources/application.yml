# ---------------------------------------------------------------------------
# alert-service - nodo B
# ---------------------------------------------------------------------------
server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: alert-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:centinela}
    username: ${DB_USER:centinela}
    password: ${DB_PASSWORD:centinela}
    hikari:
      maximum-pool-size: 10
      # Con la base caida, esperar 30 s por una conexion colgaba /actuator/health y el vigilante
      # creia muerto al servicio. 2 s basta en la LAN; la falla se reintenta como transitoria.
      connection-timeout: ${DB_CONNECTION_TIMEOUT:2000}
  flyway:
    placeholders:
      grafanaPassword: ${GRAFANA_DB_PASSWORD:grafana-reader}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    client-id: ${spring.application.name}-${NODE_NAME:nodo-b}   # identifica la maquina en los grupos de consumidores
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 500
        # Si una instancia muere, Kafka reasigna sus particiones en ~10 s (antes 45 s por defecto)
        session.timeout.ms: ${KAFKA_SESSION_TIMEOUT_MS:10000}
        heartbeat.interval.ms: ${KAFKA_HEARTBEAT_INTERVAL_MS:3000}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:3000}
  lifecycle:
    timeout-per-shutdown-phase: 15s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:centinela-redis}
      timeout: ${REDIS_TIMEOUT:2s}
  jackson:
    serialization:
      write-dates-as-timestamps: false

alerts:
  plate-hmac-secret: ${PLATE_HMAC_SECRET:dev-cambiar-esta-llave-en-produccion}
  watchlist-plates: P512KLM,P777HTR,M045BBC
  plate-retention: 30d
  alert-expiry: 2h
  event-store-concurrency: 2
  console:
    grafana-port: ${GRAFANA_PORT:3000}   # enlace "Abrir Grafana" de la consola
  slo:
    latency-threshold-ms: 2000      # "alerta generada en menos de 2 segundos desde el evento"
    target-ratio: 0.95              # ...en al menos el 95 % de los casos
    window: 5m
    freshness-threshold-ms: 10000   # los datos deben verse en el dashboard en menos de 10 s
    overload-lag: 1000              # sobrecarga = atraso >= 1000 mensajes y creciendo (si no, es puesta al dia)
  security:
    operator-user: ${OPERATOR_USER:operador}
    operator-password: ${OPERATOR_PASSWORD:operador123}
    admin-user: ${ADMIN_USER:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}

management:
  endpoint:
    health:
      probes:
        enabled: true           # /actuator/health/liveness: la consola y el vigilante saben si B vive
      show-components: always
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
      node: ${NODE_NAME:nodo-b}

logging:
  level:
    # Con Kafka caido, cada consumidor repite "Connection to node 1 could not be established" cada
    # segundo; el vigilante y /actuator/health ya informan la caida y la recuperacion (ADR-006).
    org.apache.kafka.clients.NetworkClient: ${KAFKA_NETWORK_LOG_LEVEL:ERROR}
    # El chequeo de salud de Redis escribe la traza completa en cada consulta; el estado ya se ve en
    # /actuator/health y en el vigilante.
    org.springframework.boot.actuate.data.redis: ERROR
    org.springframework.boot.actuate.jdbc: ERROR
