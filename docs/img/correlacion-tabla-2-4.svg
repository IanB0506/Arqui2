<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" font-family="Arial, Helvetica, sans-serif">
  <!-- Pensada para imprimirse a 16,5 cm de ancho: el texto mas pequeno (18 px) queda en 8,4 pt.
       Tiempos y latencias de una ejecucion real del escenario tabla-2-4 (25 de octubre de 2026, 18:23 UTC). -->
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="1000" height="850" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" fill="#263238">Regla R1-ROBO: ancla = botón de pánico (0,40); alerta HIGH desde 0,70; CRITICAL desde 0,90.</text>
  <text x="20" y="58" font-size="18" fill="#546e7a">Ventana: de 2 min antes a 5 min después del ancla, en la misma zona.</text>

  <!-- fila 1 -->
  <text x="20" y="104" font-size="21" font-weight="bold" fill="#263238">Fila 1 · Zona 4: pánico + placa XYZ123 + 85 km/h</text>
  <rect x="20" y="118" width="960" height="214" rx="10" fill="#f5f5f5" stroke="#cfd8dc"/>
  <line x1="60" y1="290" x2="950" y2="290" stroke="#37474f" stroke-width="2.5" marker-end="url(#f)"/>
  <g font-size="18" fill="#546e7a" text-anchor="middle">
    <text x="80" y="318">0 s</text><text x="680" y="318">+10 s</text><text x="800" y="318">+12 s</text>
  </g>
  <rect x="40" y="132" width="290" height="68" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="54" y="160" font-size="19" font-weight="bold" fill="#bf360c">Botón de pánico ROBO</text>
  <text x="54" y="186" font-size="18" fill="#bf360c">Ancla: puntaje 0,40</text>
  <rect x="356" y="132" width="314" height="68" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="370" y="160" font-size="19" font-weight="bold" fill="#4a148c">LPR: XYZ*** a 84 km/h</text>
  <text x="370" y="186" font-size="18" fill="#4a148c">+0,20 → 0,60: aún sin alerta</text>
  <rect x="690" y="132" width="280" height="68" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="704" y="160" font-size="19" font-weight="bold" fill="#0d47a1">Velocidad 85 km/h</text>
  <text x="704" y="186" font-size="18" fill="#0d47a1">+0,30 → 0,90: CRITICAL</text>
  <g stroke-dasharray="5 4" stroke-width="1.5">
    <line x1="80" y1="200" x2="80" y2="280" stroke="#e65100"/>
    <line x1="660" y1="200" x2="678" y2="280" stroke="#8e24aa"/>
    <line x1="760" y1="200" x2="798" y2="280" stroke="#1e88e5"/>
  </g>
  <circle cx="80" cy="290" r="9" fill="#e65100"/>
  <circle cx="680" cy="290" r="9" fill="#8e24aa"/>
  <circle cx="800" cy="290" r="9" fill="#1e88e5"/>

  <text x="20" y="373" font-size="19" font-weight="bold" fill="#263238">Puntaje</text>
  <rect x="130" y="350" width="800" height="32" rx="6" fill="#eceff1"/>
  <rect x="130" y="350" width="320" height="32" rx="6" fill="#ffb74d"/>
  <rect x="450" y="350" width="160" height="32" fill="#ce93d8"/>
  <rect x="610" y="350" width="240" height="32" fill="#90caf9"/>
  <g font-size="18" fill="#263238" text-anchor="middle">
    <text x="290" y="373">pánico 0,40</text><text x="530" y="373">LPR 0,20</text><text x="770" y="373">velocidad 0,30</text>
  </g>
  <line x1="690" y1="342" x2="690" y2="390" stroke="#e65100" stroke-width="3"/>
  <line x1="850" y1="342" x2="850" y2="390" stroke="#c62828" stroke-width="3"/>
  <text x="690" y="412" text-anchor="middle" font-size="18" fill="#e65100">umbral 0,70</text>
  <text x="850" y="412" text-anchor="middle" font-size="18" fill="#c62828">crítico 0,90</text>
  <text x="20" y="450" font-size="19" fill="#2e7d32">Resultado medido: ROBO_EN_CURSO CRITICAL a los 11,8 s, con una latencia de 19 ms.</text>
  <text x="20" y="476" font-size="18" fill="#546e7a">Resultado esperado en el enunciado: «generación de alerta de robo en curso».</text>

  <!-- fila 2 -->
  <text x="20" y="530" font-size="21" font-weight="bold" fill="#263238">Fila 2 · Zona 10: pánico sin eventos complementarios</text>
  <rect x="20" y="544" width="960" height="166" rx="10" fill="#f5f5f5" stroke="#cfd8dc"/>
  <line x1="60" y1="670" x2="950" y2="670" stroke="#37474f" stroke-width="2.5" marker-end="url(#f)"/>
  <g font-size="18" fill="#546e7a" text-anchor="middle">
    <text x="80" y="698">0 s</text><text x="876" y="698">+90 s: vence el plazo</text>
  </g>
  <rect x="40" y="558" width="300" height="68" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="54" y="586" font-size="19" font-weight="bold" fill="#bf360c">Botón de pánico PÁNICO</text>
  <text x="54" y="612" font-size="18" fill="#bf360c">0,40 &lt; 0,70: queda pendiente</text>
  <rect x="370" y="568" width="290" height="48" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-dasharray="6 4"/>
  <text x="515" y="599" text-anchor="middle" font-size="18" fill="#607d8b">Ninguna evidencia en la zona</text>
  <rect x="690" y="558" width="280" height="68" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="704" y="586" font-size="18" font-weight="bold" fill="#4a148c">POSIBLE_FALSO_POSITIVO</text>
  <text x="704" y="612" font-size="18" fill="#4a148c">Severidad LOW</text>
  <g stroke-dasharray="5 4" stroke-width="1.5">
    <line x1="80" y1="626" x2="80" y2="660" stroke="#e65100"/>
    <line x1="876" y1="626" x2="876" y2="660" stroke="#7b1fa2"/>
  </g>
  <circle cx="80" cy="670" r="9" fill="#e65100"/>
  <circle cx="876" cy="670" r="9" fill="#7b1fa2"/>
  <text x="20" y="746" font-size="19" fill="#2e7d32">Resultado medido: POSIBLE_FALSO_POSITIVO a los 92 s, sin alerta de robo.</text>
  <text x="20" y="772" font-size="18" fill="#546e7a">Resultado esperado en el enunciado: «falso positivo, sin eventos complementarios».</text>
  <text x="20" y="812" font-size="18" fill="#546e7a">Si la evidencia llega después, el motor la integra al incidente. Más de 5 pánicos en</text>
  <text x="20" y="836" font-size="18" fill="#546e7a">10 min marcan al dispositivo como sospechoso.</text>
</svg>
