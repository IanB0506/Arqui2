<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" font-family="Arial, Helvetica, sans-serif">
  <!-- Pensada para imprimirse a 16,5 cm de ancho: el texto mas pequeno (18 px) queda en 8,4 pt. -->
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#263238"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>
  <rect width="1000" height="1000" fill="#ffffff"/>

  <!-- 1. sensores -->
  <rect x="20" y="10" width="960" height="112" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="40" y="44" font-size="21" font-weight="bold" fill="#1b5e20">1. Sensores simulados (sensor-simulator, nodos C y D)</text>
  <text x="40" y="76" font-size="19" fill="#1b5e20">Botones de pánico, cámaras LPR, velocidad, acústicos y reportes ciudadanos</text>
  <text x="40" y="106" font-size="18" fill="#33691e">Tráfico de fondo, escenarios, picos, replay CSV y buffer en disco para los críticos</text>

  <!-- 2. topics crudos -->
  <rect x="20" y="158" width="960" height="84" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="40" y="192" font-size="21" font-weight="bold" fill="#0d47a1">2. Kafka: topics crudos</text>
  <text x="40" y="224" font-size="19" fill="#0d47a1">Un topic por tipo de sensor: una avalancha de placas no retrasa los pánicos</text>

  <!-- 3. ingesta + DLQ -->
  <rect x="20" y="278" width="740" height="120" rx="12" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="40" y="312" font-size="21" font-weight="bold" fill="#bf360c">3. ingestion-service</text>
  <text x="40" y="344" font-size="19" fill="#bf360c">Valida el contrato, resuelve la zona y seudonimiza la placa</text>
  <text x="40" y="374" font-size="19" fill="#bf360c">(HMAC); deduplica y marca anomalías</text>
  <rect x="800" y="290" width="180" height="96" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="814" y="322" font-size="19" font-weight="bold" fill="#b71c1c">events.dlq</text>
  <text x="814" y="348" font-size="18" fill="#b71c1c">Inválidos con</text>
  <text x="814" y="372" font-size="18" fill="#b71c1c">su causa</text>
  <line x1="762" y1="338" x2="796" y2="338" stroke="#c62828" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#r)"/>

  <!-- 4. events.normalized -->
  <rect x="20" y="434" width="960" height="84" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="40" y="468" font-size="21" font-weight="bold" fill="#0d47a1">4. Kafka: events.normalized</text>
  <text x="40" y="500" font-size="19" fill="#0d47a1">Llave = zona; la zona N va a la partición N − 1: orden por zona y carga pareja</text>

  <!-- 5a correlacion / 5b alertas -->
  <rect x="20" y="556" width="450" height="150" rx="12" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
  <text x="40" y="590" font-size="21" font-weight="bold" fill="#4a148c">5a. correlation-engine</text>
  <text x="40" y="622" font-size="19" fill="#4a148c">Reglas de evidencia ponderada</text>
  <text x="40" y="652" font-size="19" fill="#4a148c">Incidentes y vehículos en fuga</text>
  <text x="40" y="682" font-size="19" fill="#4a148c">Falso positivo a los 90 s</text>
  <rect x="530" y="556" width="450" height="150" rx="12" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="550" y="590" font-size="21" font-weight="bold" fill="#bf360c">5b. alert-service</text>
  <text x="550" y="622" font-size="19" fill="#bf360c">Guarda eventos y alertas</text>
  <text x="550" y="652" font-size="19" fill="#bf360c">Mide el SLO y avisa en vivo (SSE)</text>
  <text x="550" y="682" font-size="19" fill="#bf360c">Tareas periódicas con ShedLock</text>
  <line x1="472" y1="640" x2="526" y2="640" stroke="#263238" stroke-width="2.5" marker-end="url(#f)"/>
  <text x="499" y="628" text-anchor="middle" font-size="18" fill="#263238">alerts</text>

  <!-- almacenes y operador -->
  <rect x="20" y="752" width="450" height="96" rx="12" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
  <text x="40" y="786" font-size="21" font-weight="bold" fill="#263238">Redis</text>
  <text x="40" y="818" font-size="19" fill="#37474f">Ventanas e incidentes compartidos</text>
  <rect x="530" y="752" width="215" height="96" rx="12" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
  <text x="546" y="786" font-size="21" font-weight="bold" fill="#263238">TimescaleDB</text>
  <text x="546" y="818" font-size="19" fill="#37474f">Historial</text>
  <rect x="765" y="752" width="215" height="96" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
  <text x="781" y="786" font-size="21" font-weight="bold" fill="#1a237e">Operador</text>
  <text x="781" y="818" font-size="19" fill="#283593">Consola y Grafana</text>

  <!-- flechas del flujo principal -->
  <g stroke="#263238" stroke-width="2.5" fill="none" marker-end="url(#f)">
    <line x1="390" y1="122" x2="390" y2="154"/>
    <line x1="390" y1="242" x2="390" y2="274"/>
    <line x1="390" y1="398" x2="390" y2="430"/>
    <line x1="245" y1="518" x2="245" y2="552"/>
    <line x1="755" y1="518" x2="755" y2="552"/>
    <line x1="637" y1="706" x2="637" y2="748"/>
    <line x1="872" y1="706" x2="872" y2="748"/>
  </g>
  <line x1="245" y1="710" x2="245" y2="748" stroke="#263238" stroke-width="2.5" marker-start="url(#f)" marker-end="url(#f)"/>

  <!-- observabilidad y trazabilidad -->
  <rect x="20" y="882" width="960" height="108" rx="12" fill="#fbe9e7" stroke="#8d6e63" stroke-width="2"/>
  <text x="40" y="916" font-size="19" fill="#4e342e"><tspan font-weight="bold">Observabilidad:</tspan> Prometheus mide todos los servicios cada 5 s.</text>
  <text x="40" y="946" font-size="19" fill="#4e342e"><tspan font-weight="bold">Trazabilidad:</tspan> el identificador de cada evento viaja del sensor a la</text>
  <text x="40" y="974" font-size="19" fill="#4e342e">evidencia de la alerta, y la consola abre el evento original.</text>
</svg>
