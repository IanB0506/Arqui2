<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" font-family="Arial, Helvetica, sans-serif">
  <!-- Pensada para imprimirse a 16,5 cm de ancho: el texto mas pequeno (18 px) queda en 8,4 pt. -->
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#263238"/>
    </marker>
  </defs>
  <rect width="1000" height="1010" fill="#ffffff"/>

  <!-- VLAN 10: sensores y borde -->
  <rect x="10" y="10" width="450" height="452" rx="14" fill="#e8f5e9" stroke="#43a047" stroke-width="2" stroke-dasharray="9 5"/>
  <text x="28" y="42" font-size="21" font-weight="bold" fill="#1b5e20">VLAN 10 · Sensores y borde</text>

  <rect x="28" y="58" width="414" height="178" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="44" y="88" font-size="20" font-weight="bold" fill="#263238">Nodo C</text>
  <text x="426" y="88" text-anchor="end" font-size="18" fill="#546e7a">Windows + Docker</text>
  <rect x="44" y="100" width="382" height="62" rx="8" fill="#c8e6c9"/>
  <text x="56" y="125" font-size="19" font-weight="bold" fill="#1b5e20">sensor-simulator :8080</text>
  <text x="56" y="150" font-size="18" fill="#1b5e20">Zonas 1 a 6 y vigilante del nodo B</text>
  <rect x="44" y="172" width="382" height="50" rx="8" fill="#f1f8e9" stroke="#7cb342" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="203" font-size="18" fill="#33691e">Workers de ingesta y correlación</text>

  <rect x="28" y="250" width="414" height="140" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="44" y="280" font-size="20" font-weight="bold" fill="#263238">Nodo D</text>
  <text x="426" y="280" text-anchor="end" font-size="18" fill="#546e7a">Windows + Docker</text>
  <rect x="44" y="292" width="382" height="40" rx="8" fill="#c8e6c9"/>
  <text x="56" y="319" font-size="19" font-weight="bold" fill="#1b5e20">sensor-simulator · zonas 7 a 12</text>
  <rect x="44" y="340" width="382" height="40" rx="8" fill="#f1f8e9" stroke="#7cb342" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="366" font-size="18" fill="#33691e">Workers (opcionales)</text>

  <text x="28" y="420" font-size="18" fill="#1b5e20">Abre conexiones hacia A (9092, 6379)</text>
  <text x="28" y="444" font-size="18" fill="#1b5e20">y hacia B (8081 a 8083)</text>

  <!-- VLAN 30: datos -->
  <rect x="540" y="10" width="450" height="452" rx="14" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" stroke-dasharray="9 5"/>
  <text x="558" y="42" font-size="21" font-weight="bold" fill="#0d47a1">VLAN 30 · Datos</text>
  <rect x="558" y="58" width="414" height="352" rx="10" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="574" y="88" font-size="20" font-weight="bold" fill="#263238">Nodo A</text>
  <text x="956" y="88" text-anchor="end" font-size="18" fill="#546e7a">Windows + Docker</text>
  <rect x="574" y="100" width="382" height="66" rx="8" fill="#bbdefb"/>
  <text x="586" y="126" font-size="19" font-weight="bold" fill="#0d47a1">Kafka 3.9 (KRaft) :9092</text>
  <text x="586" y="152" font-size="18" fill="#0d47a1">Un topic por sensor, 12 particiones</text>
  <rect x="574" y="176" width="382" height="66" rx="8" fill="#bbdefb"/>
  <text x="586" y="202" font-size="19" font-weight="bold" fill="#0d47a1">TimescaleDB 2.17 :5432</text>
  <text x="586" y="228" font-size="18" fill="#0d47a1">Eventos, alertas y auditoría</text>
  <rect x="574" y="252" width="382" height="66" rx="8" fill="#bbdefb"/>
  <text x="586" y="278" font-size="19" font-weight="bold" fill="#0d47a1">Redis 7.4 :6379</text>
  <text x="586" y="304" font-size="18" fill="#0d47a1">Ventanas, incidentes, placas</text>
  <text x="574" y="350" font-size="18" fill="#37474f">Respaldo de la base cada 6 h</text>
  <text x="574" y="380" font-size="18" fill="#37474f">Producción: Ubuntu Server 22.04</text>
  <text x="558" y="444" font-size="18" fill="#0d47a1">No inicia conexiones</text>

  <!-- VLAN 20: servicios -->
  <rect x="540" y="500" width="450" height="400" rx="14" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" stroke-dasharray="9 5"/>
  <text x="558" y="532" font-size="21" font-weight="bold" fill="#bf360c">VLAN 20 · Servicios</text>
  <rect x="558" y="548" width="414" height="276" rx="10" fill="#ffffff" stroke="#e65100" stroke-width="2"/>
  <text x="574" y="578" font-size="20" font-weight="bold" fill="#263238">Nodo B</text>
  <text x="956" y="578" text-anchor="end" font-size="18" fill="#546e7a">Windows + Docker</text>
  <rect x="574" y="590" width="382" height="40" rx="8" fill="#ffe0b2"/>
  <text x="586" y="617" font-size="19" font-weight="bold" fill="#bf360c">ingestion-service :8081</text>
  <rect x="574" y="638" width="382" height="40" rx="8" fill="#ffe0b2"/>
  <text x="586" y="665" font-size="19" font-weight="bold" fill="#bf360c">correlation-engine :8082</text>
  <rect x="574" y="686" width="382" height="40" rx="8" fill="#ffe0b2"/>
  <text x="586" y="713" font-size="19" font-weight="bold" fill="#bf360c">alert-service y consola :8083</text>
  <rect x="574" y="734" width="186" height="76" rx="8" fill="#fbe9e7"/>
  <text x="586" y="764" font-size="19" font-weight="bold" fill="#4e342e">Prometheus</text>
  <text x="586" y="792" font-size="18" fill="#4e342e">:9090</text>
  <rect x="770" y="734" width="186" height="76" rx="8" fill="#fbe9e7"/>
  <text x="782" y="764" font-size="19" font-weight="bold" fill="#4e342e">Grafana</text>
  <text x="782" y="792" font-size="18" fill="#4e342e">:3000</text>
  <text x="558" y="856" font-size="18" fill="#bf360c">Abre conexiones hacia A (9092, 5432,</text>
  <text x="558" y="880" font-size="18" fill="#bf360c">6379) y hacia C/D (métricas)</text>

  <!-- VLAN 40: operadores -->
  <rect x="10" y="500" width="450" height="228" rx="14" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" stroke-dasharray="9 5"/>
  <text x="28" y="532" font-size="21" font-weight="bold" fill="#4a148c">VLAN 40 · Operadores</text>
  <rect x="28" y="548" width="414" height="98" rx="10" fill="#ffffff" stroke="#6a1b9a" stroke-width="2"/>
  <text x="44" y="580" font-size="20" font-weight="bold" fill="#263238">Centro de monitoreo</text>
  <text x="44" y="608" font-size="18" fill="#4a148c">Consola del operador y Grafana</text>
  <text x="44" y="632" font-size="18" fill="#4a148c">Roles OPERATOR y ADMIN</text>
  <text x="28" y="680" font-size="18" fill="#4a148c">Alcanza B (8083, 3000) y el</text>
  <text x="28" y="704" font-size="18" fill="#4a148c">vigilante de C (8080)</text>

  <!-- DMZ -->
  <rect x="10" y="748" width="450" height="152" rx="14" fill="#eceff1" stroke="#546e7a" stroke-width="2" stroke-dasharray="9 5"/>
  <text x="28" y="780" font-size="21" font-weight="bold" fill="#263238">DMZ (producción)</text>
  <text x="28" y="812" font-size="18" fill="#37474f">Proxy inverso con TLS: recibe la</text>
  <text x="28" y="836" font-size="18" fill="#37474f">aplicación ciudadana desde internet</text>
  <text x="28" y="860" font-size="18" fill="#37474f">y solo la reenvía a B (8081)</text>

  <!-- conexiones permitidas por el firewall -->
  <g stroke="#263238" stroke-width="2.5" fill="none" marker-end="url(#f)">
    <line x1="462" y1="160" x2="536" y2="160"/>
    <path d="M462,440 L524,440 L524,548 L536,548"/>
    <line x1="765" y1="498" x2="765" y2="466"/>
    <line x1="462" y1="600" x2="536" y2="600"/>
    <line x1="462" y1="836" x2="536" y2="790"/>
  </g>
  <g font-size="18" fill="#263238" text-anchor="middle">
    <text x="499" y="130">9092</text>
    <text x="499" y="150">6379</text>
    <text x="492" y="488">8081–</text>
    <text x="492" y="510">8083</text>
    <text x="499" y="580">8083</text>
    <text x="499" y="624">3000</text>
    <text x="499" y="778">8081</text>
  </g>
  <text x="782" y="487" font-size="18" fill="#263238">9092, 5432, 6379</text>

  <!-- leyenda -->
  <line x1="12" y1="945" x2="72" y2="945" stroke="#263238" stroke-width="2.5" marker-end="url(#f)"/>
  <text x="84" y="951" font-size="18" fill="#263238">Conexión que permite el firewall (puertos)</text>
  <rect x="12" y="968" width="60" height="26" rx="5" fill="#f1f8e9" stroke="#7cb342" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="84" y="988" font-size="18" fill="#263238">Instancia opcional para repartir la carga</text>
  <rect x="540" y="934" width="60" height="26" rx="5" fill="#ffffff" stroke="#546e7a" stroke-width="2" stroke-dasharray="9 5"/>
  <text x="612" y="954" font-size="18" fill="#263238">Segmento de red (VLAN)</text>
</svg>
