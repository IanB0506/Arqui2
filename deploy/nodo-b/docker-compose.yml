# =============================================================================
# NODO B - Microservicios y visualizacion:
#   ingestion-service, correlation-engine, alert-service, Prometheus, Grafana
# SO: Windows 10/11 con Docker Desktop (el enunciado recomienda macOS / Linux).
#
#   Windows:  centinela.cmd configurar   (nodo B)   y luego   centinela.cmd iniciar
#             (el script genera targets/generadores.json con las IP de los nodos C/D)
#   Manual:   docker compose --env-file .env -f deploy/nodo-b/docker-compose.yml up -d
#
# Puertos hacia la LAN: ALERT_SERVICE_PORT 8083 (API/consola), GRAFANA_PORT 3000,
# PROMETHEUS_PORT 9090, INGESTION_PORT 8081 / CORRELATION_PORT 8082 (gateway, metricas, vigilante)
# =============================================================================
name: centinela-nodo-b

x-java-service: &java-service
  restart: unless-stopped
  build: &java-build
    context: ../..
    dockerfile: Dockerfile
    target: ${BUILD_TARGET:-runtime}
  environment: &java-env
    KAFKA_BOOTSTRAP_SERVERS: ${NODE_A_IP:?Defina NODE_A_IP en .env}:${KAFKA_PORT:-9092}
    REDIS_HOST: ${NODE_A_IP}
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-centinela-redis}
    DB_HOST: ${NODE_A_IP}
    DB_PORT: ${DB_PORT:-5432}
    DB_PASSWORD: ${DB_PASSWORD:-centinela}
    PLATE_HMAC_SECRET: ${PLATE_HMAC_SECRET:-dev-cambiar-esta-llave-en-produccion}
    NODE_NAME: nodo-b
    JAVA_OPTS: -Xmx512m -XX:+ExitOnOutOfMemoryError

services:
  ingestion-service:
    <<: *java-service
    build: { <<: *java-build, args: { MODULE: ingestion-service } }
    image: centinela/ingestion-service:1.0.0
    ports: ["${INGESTION_PORT:-8081}:8081"]
    # Spool del gateway REST de la app movil: si Kafka no responde, el evento critico queda aqui
    environment:
      <<: *java-env
      INGESTION_SPOOL_DIR: /data/spool
    volumes:
      - ingestion-spool:/data/spool
    stop_grace_period: 40s   # apagado ordenado: termina peticiones, sale del grupo y compacta el spool

  correlation-engine:
    <<: *java-service
    build: { <<: *java-build, args: { MODULE: correlation-engine } }
    image: centinela/correlation-engine:1.0.0
    ports: ["${CORRELATION_PORT:-8082}:8082"]

  alert-service:
    <<: *java-service
    build: { <<: *java-build, args: { MODULE: alert-service } }
    image: centinela/alert-service:1.0.0
    ports: ["${ALERT_SERVICE_PORT:-8083}:8083"]
    environment:
      <<: *java-env
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-reader}
      OPERATOR_USER: ${OPERATOR_USER:-operador}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-operador123}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      GRAFANA_PORT: ${GRAFANA_PORT:-3000}   # solo para el enlace "Abrir Grafana" de la consola

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ../../infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets:/etc/prometheus/targets:ro

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/centro-de-monitoreo.json
      TSDB_HOST: ${NODE_A_IP}:${DB_PORT:-5432}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-reader}
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - ../../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
  ingestion-spool:
