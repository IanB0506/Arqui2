# =============================================================================
# NODO A - Datos (Ubuntu Server 22.04): Kafka, TimescaleDB, Redis
#   cd deploy/nodo-a && cp ../../.env.example .env   # editar NODE_A_IP con la IP de esta maquina
#   docker compose up -d
# Puertos que deben quedar abiertos SOLO hacia la LAN del laboratorio:
#   9092 (Kafka, nodos B/C/D) - 5432 (TimescaleDB, nodo B) - 6379 (Redis, nodos B/C/D)
# =============================================================================
name: centinela-nodo-a

services:
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports: ["9092:9092"]
    environment:
      CLUSTER_ID: Q2VudGluZWxhVXJiYW5vMQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Los clientes de otras maquinas usan esta direccion: debe ser la IP LAN del nodo A
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${NODE_A_IP:?Defina NODE_A_IP en .env}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: -Xms1g -Xmx2g
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: centinela
      POSTGRES_USER: centinela
      POSTGRES_PASSWORD: ${DB_PASSWORD:-centinela}
      TS_TUNE_MEMORY: 4GB
      TS_TUNE_NUM_CPUS: "4"
    volumes:
      - tsdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centinela -d centinela"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-centinela-redis}
      --maxmemory 512mb --maxmemory-policy volatile-ttl --save "" --appendonly no
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-centinela-redis} --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  kafka-data:
  tsdb-data:
