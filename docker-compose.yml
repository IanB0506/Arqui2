# =============================================================================
# Centinela Urbano - despliegue en UNA sola maquina (desarrollo, demo rapida y plan B)
#
#   Windows:  centinela.cmd configurar  (opcion 1)   y luego   centinela.cmd iniciar
#   Manual:   copiar .env.example a .env y ejecutar   docker compose up -d --build
#
# Todos los puertos publicados se pueden cambiar en .env (SIMULATOR_PORT, INGESTION_PORT, ...),
# por ejemplo si Windows los tiene reservados: centinela.cmd puertos -Arreglar
# Para repartir el sistema en varias maquinas (nodos A, B, C/D) ver deploy/README.md
# =============================================================================
name: centinela

x-java-service: &java-service
  restart: unless-stopped
  build: &java-build
    context: .
    dockerfile: Dockerfile
    target: ${BUILD_TARGET:-runtime}
  environment: &java-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:-centinela-redis}
    DB_HOST: timescaledb
    DB_PASSWORD: ${DB_PASSWORD:-centinela}
    PLATE_HMAC_SECRET: ${PLATE_HMAC_SECRET:-dev-cambiar-esta-llave-en-produccion}
    NODE_NAME: nodo-unico
    JAVA_OPTS: -Xmx384m -XX:+ExitOnOutOfMemoryError

services:
  # --------------------------------------------------------------- nodo A: datos
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"   # acceso desde el host (herramientas, servicios fuera de Docker)
    environment:
      CLUSTER_ID: Q2VudGluZWxhVXJiYW5vMQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller           # modo KRaft: sin ZooKeeper
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: centinela
      POSTGRES_USER: centinela
      POSTGRES_PASSWORD: ${DB_PASSWORD:-centinela}
      TS_TUNE_MEMORY: 1GB
      TS_TUNE_NUM_CPUS: "2"
    volumes:
      - tsdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centinela -d centinela"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # volatile-ttl: si se llena la memoria solo se descartan llaves con expiracion (ventanas de
    # correlacion), nunca la lista de placas robadas. Sin persistencia: el estado es temporal.
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-centinela-redis}
      --maxmemory 256mb --maxmemory-policy volatile-ttl --save "" --appendonly no
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-centinela-redis} --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Respaldo automático de la base (pg_dump cada BACKUP_INTERVAL_HOURS, conserva BACKUP_KEEP).
  # Los archivos quedan en la carpeta backups/ del repositorio, visible desde Windows.
  db-backup:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/respaldo.sh"]
    command: ["ciclo"]
    environment:
      PGHOST: timescaledb
      PGUSER: centinela
      PGPASSWORD: ${DB_PASSWORD:-centinela}
      PGDATABASE: centinela
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_KEEP: ${BACKUP_KEEP:-8}
    volumes:
      - ./backups:/backups
      - ./infra/backup:/scripts:ro
    depends_on:
      timescaledb: { condition: service_healthy }

  # --------------------------------------------------------- nodo B: servicios
  ingestion-service:
    <<: *java-service
    build:
      <<: *java-build
      args: { MODULE: ingestion-service }
    image: centinela/ingestion-service:1.0.0
    ports: ["${INGESTION_PORT:-8081}:8081"]
    # Spool del gateway REST de la app movil: si Kafka no responde, el evento critico queda aqui
    environment:
      <<: *java-env
      INGESTION_SPOOL_DIR: /data/spool
    volumes:
      - ingestion-spool:/data/spool
    stop_grace_period: 40s   # apagado ordenado: termina peticiones, sale del grupo y compacta el spool
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }

  correlation-engine:
    <<: *java-service
    build:
      <<: *java-build
      args: { MODULE: correlation-engine }
    image: centinela/correlation-engine:1.0.0
    ports: ["${CORRELATION_PORT:-8082}:8082"]
    environment:
      <<: *java-env
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/config/   # reglas editables sin recompilar (infra/correlation)
    volumes:
      - ./infra/correlation:/config:ro
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }

  alert-service:
    <<: *java-service
    build:
      <<: *java-build
      args: { MODULE: alert-service }
    image: centinela/alert-service:1.0.0
    ports: ["${ALERT_SERVICE_PORT:-8083}:8083"]
    environment:
      <<: *java-env
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-reader}
      OPERATOR_USER: ${OPERATOR_USER:-operador}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-operador123}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      GRAFANA_PORT: ${GRAFANA_PORT:-3000}   # solo para el enlace "Abrir Grafana" de la consola
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      timescaledb: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/targets:/etc/prometheus/targets:ro

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/centro-de-monitoreo.json
      # on-premise sin internet: Grafana no consulta servicios externos (actualizaciones, noticias, telemetria)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      TSDB_HOST: timescaledb:5432
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-reader}
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./infra/grafana/maps/zonas-guatemala.geojson:/usr/share/grafana/public/maps/zonas-guatemala.geojson:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - alert-service

  # ------------------------------------------------------- nodo C/D: generadores
  sensor-simulator:
    <<: *java-service
    build:
      <<: *java-build
      args: { MODULE: sensor-simulator }
    image: centinela/sensor-simulator:1.0.0
    ports: ["${SIMULATOR_PORT:-8080}:8080"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ALERT_SERVICE_URL: http://alert-service:8083
      OPERATOR_USER: ${OPERATOR_USER:-operador}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-operador123}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SIMULATOR_NODE_NAME: nodo-unico
      SIMULATOR_SPOOL_DIR: /data/spool
      # Vigilante: revisa la salud de los servicios del "nodo B" y de Kafka
      WATCHDOG_INGESTION_URL: http://ingestion-service:8081/actuator/health
      WATCHDOG_CORRELATION_URL: http://correlation-engine:8082/actuator/health
      WATCHDOG_PROMETHEUS_URL: http://prometheus:9090/-/healthy
      WATCHDOG_GRAFANA_URL: http://grafana:3000/api/health
      JAVA_OPTS: -Xmx256m -XX:+ExitOnOutOfMemoryError
    volumes:
      - simulator-spool:/data/spool
    stop_grace_period: 30s
    depends_on:
      kafka: { condition: service_healthy }

volumes:
  kafka-data:
  tsdb-data:
  grafana-data:
  simulator-spool:
  ingestion-spool:
