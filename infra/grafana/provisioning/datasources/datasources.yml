apiVersion: 1
datasources:
  # Datos de negocio (eventos, alertas, SLO) - usuario de solo lectura que solo ve vistas sin seudonimos
  - name: TimescaleDB
    uid: timescaledb
    type: grafana-postgresql-datasource
    url: ${TSDB_HOST}
    user: grafana_reader
    isDefault: true
    jsonData:
      database: centinela
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
      timeInterval: 5s
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
  # Metricas tecnicas de los microservicios
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: ${PROMETHEUS_URL}
    jsonData:
      timeInterval: 5s
