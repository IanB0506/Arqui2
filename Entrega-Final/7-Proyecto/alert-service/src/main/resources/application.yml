server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: alert-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:centinela}
    username: ${DB_USER:centinela}
    password: ${DB_PASSWORD:centinela}
    hikari:
      maximum-pool-size: 10
      connection-timeout: ${DB_CONNECTION_TIMEOUT:2000}
  flyway:
    placeholders:
      grafanaPassword: ${GRAFANA_DB_PASSWORD:grafana-reader}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    client-id: ${spring.application.name}-${NODE_NAME:nodo-b}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 500
        session.timeout.ms: ${KAFKA_SESSION_TIMEOUT_MS:10000}
        heartbeat.interval.ms: ${KAFKA_HEARTBEAT_INTERVAL_MS:3000}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:3000}
        partitioner.class: gt.umg.centinela.common.kafka.ZonePartitioner
  lifecycle:
    timeout-per-shutdown-phase: 15s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:centinela-redis}
      timeout: ${REDIS_TIMEOUT:2s}
  jackson:
    serialization:
      write-dates-as-timestamps: false

alerts:
  plate-hmac-secret: ${PLATE_HMAC_SECRET:dev-cambiar-esta-llave-en-produccion}
  watchlist-plates: P512KLM,P777HTR,M045BBC
  plate-retention: 30d
  alert-expiry: 2h
  event-store-concurrency: 2
  console:
    grafana-port: ${GRAFANA_PORT:3000}
  slo:
    latency-threshold-ms: 2000
    target-ratio: 0.95
    window: 5m
    freshness-threshold-ms: 10000
    overload-lag: 1000
  security:
    operator-user: ${OPERATOR_USER:operador}
    operator-password: ${OPERATOR_PASSWORD:operador123}
    admin-user: ${ADMIN_USER:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
      node: ${NODE_NAME:nodo-b}

logging:
  level:
    org.apache.kafka.clients.NetworkClient: ${KAFKA_NETWORK_LOG_LEVEL:ERROR}
    org.springframework.boot.actuate.data.redis: ERROR
    org.springframework.boot.actuate.jdbc: ERROR
