name: centinela-nodo-a

services:
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports: ["${KAFKA_PORT:-9092}:${KAFKA_PORT:-9092}"]
    environment:
      CLUSTER_ID: Q2VudGluZWxhVXJiYW5vMQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # EXTERNAL lo usan B, C y D y anuncia la IP del nodo A; INTERNAL es para comandos dentro del contenedor.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:${KAFKA_PORT:-9092},CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${NODE_A_IP:?Defina NODE_A_IP en .env}:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: -Xms1g -Xmx2g
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    ports: ["${DB_PORT:-5432}:5432"]
    environment:
      POSTGRES_DB: centinela
      POSTGRES_USER: centinela
      POSTGRES_PASSWORD: ${DB_PASSWORD:-centinela}
      TS_TUNE_MEMORY: 4GB
      TS_TUNE_NUM_CPUS: "4"
    volumes:
      - tsdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centinela -d centinela"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # Sin persistencia a propósito: es memoria de corto plazo y se reconstruye sola (ADR-006).
    image: redis:7.4-alpine
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-centinela-redis}
      --maxmemory 512mb --maxmemory-policy volatile-ttl --save "" --appendonly no
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-centinela-redis} --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-backup:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/respaldo.sh"]
    command: ["ciclo"]
    environment:
      PGHOST: timescaledb
      PGUSER: centinela
      PGPASSWORD: ${DB_PASSWORD:-centinela}
      PGDATABASE: centinela
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_KEEP: ${BACKUP_KEEP:-8}
    volumes:
      - ../../backups:/backups
      - ../../infra/backup:/scripts:ro
    depends_on:
      timescaledb: { condition: service_healthy }

volumes:
  kafka-data:
  tsdb-data:
