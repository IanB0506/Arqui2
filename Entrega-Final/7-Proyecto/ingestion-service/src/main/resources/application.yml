server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: ingestion-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    client-id: ${spring.application.name}-${NODE_NAME:nodo-b}
    consumer:
      group-id: ingestion
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 200
        session.timeout.ms: ${KAFKA_SESSION_TIMEOUT_MS:10000}
        heartbeat.interval.ms: ${KAFKA_HEARTBEAT_INTERVAL_MS:3000}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      compression-type: lz4
      properties:
        enable.idempotence: true
        partitioner.class: gt.umg.centinela.common.kafka.ZonePartitioner
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:3000}
  task:
    scheduling:
      pool:
        size: 2
  lifecycle:
    timeout-per-shutdown-phase: 15s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:centinela-redis}
      timeout: ${REDIS_TIMEOUT:2s}

ingestion:
  plate-hmac-secret: ${PLATE_HMAC_SECRET:dev-cambiar-esta-llave-en-produccion}
  # Exceso de velocidad: más del límite × 1,3 (60 km/h → 78 km/h).
  speed-tolerance: 0.3
  default-speed-limit: 60
  # Ubicación de ciudadanos redondeada a unos 110 m.
  coordinate-decimals: 3
  max-clock-skew: 2m
  max-event-age: 24h
  allow-historical: ${INGESTION_ALLOW_HISTORICAL:false}
  dedup-ttl: 10m
  degraded-sample-rate: 0.1
  resilience:
    transient-initial-interval: 1s
    transient-max-interval: ${INGESTION_RETRY_MAX_INTERVAL:30s}
    unknown-max-attempts: 4
    retry-log-every: 10
    publish-timeout: 20s
    redis-retry-after: 5s
    dedup-pending-ttl: 60s
    degraded-stale-after: 2m
  gateway:
    spool-dir: ${INGESTION_SPOOL_DIR:./spool}
    ack-timeout: ${INGESTION_GATEWAY_ACK_TIMEOUT:3s}
    kafka-down-backoff: 10s
    max-attempts: 5
    max-size-mb: 32
    fsync: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
      node: ${NODE_NAME:nodo-b}

logging:
  level:
    org.apache.kafka.clients.NetworkClient: ${KAFKA_NETWORK_LOG_LEVEL:ERROR}
    org.springframework.boot.actuate.data.redis: ERROR
