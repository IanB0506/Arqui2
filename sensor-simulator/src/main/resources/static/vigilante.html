<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigilante de nodos</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#5d6676; --line:#dde1e7;
          --ok:#1f7a3a; --okbg:#e3f4e8; --warn:#8a5a00; --warnbg:#fff3d6; --bad:#a3222a; --badbg:#fde4e5; --grey:#e9ecf0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b2029; --text:#e6e9ef; --muted:#9aa3b2; --line:#2c3340;
            --ok:#5fd38a; --okbg:#173022; --warn:#f2c14e; --warnbg:#33290f; --bad:#ff7b82; --badbg:#3a1a1d; --grey:#262c36; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 16px; font-weight:600; font-size:18px; }
  #banner { margin:0 16px 12px; padding:14px 16px; border-radius:10px; font-weight:600; background:var(--grey); }
  #banner.OPERATIVO { background:var(--okbg); color:var(--ok); }
  #banner.DEGRADADO { background:var(--warnbg); color:var(--warn); }
  #banner.SIN_RESPUESTA { background:var(--badbg); color:var(--bad); }
  #banner small { display:block; font-weight:400; margin-top:4px; color:var(--text); }
  main { display:grid; gap:12px; padding:0 16px 24px; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; overflow-x:auto; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 8px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { text-align:left; padding:5px 6px; border-top:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; border-top:none; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; font-weight:600; background:var(--grey); }
  .UP,.OK,.BAJANDO { background:var(--okbg); color:var(--ok); }
  .DEGRADED,.ATRASADO,.SUBIENDO { background:var(--warnbg); color:var(--warn); }
  .DOWN,.SIN_CONSUMIDORES { background:var(--badbg); color:var(--bad); }
  .muted { color:var(--muted); font-size:13px; }
  button { font:inherit; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  footer { padding:0 16px 16px; }
</style>
</head>
<body>
<header>Vigilante de nodos <span id="node" class="muted"></span></header>
<div id="banner">Cargando…</div>
<main>
  <section><h2>Servicios del nodo B</h2><table id="targets"></table></section>
  <section><h2>Kafka y grupos de consumidores</h2><div id="kafka" class="muted"></div><table id="groups"></table></section>
  <section><h2>Spool en disco de este nodo</h2><table id="spool"></table>
    <p><button id="resend">Reintentar envío ahora</button> <span id="resendMsg" class="muted"></span></p></section>
  <section><h2>Últimos cambios</h2><table id="history"></table></section>
</main>
<footer class="muted" id="footer"></footer>
<script>
const $ = id => document.getElementById(id);
const time = iso => iso ? new Date(iso).toLocaleTimeString('es-GT', {hour12:false}) : '—';
const ago = iso => { if (!iso) return ''; const s = Math.round((Date.now() - new Date(iso)) / 1000);
  return s < 60 ? `hace ${s} s` : `hace ${Math.floor(s/60)} min ${s%60} s`; };
const esc = v => String(v ?? '—').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pill = v => `<span class="pill ${esc(v)}">${esc(v)}</span>`;
const LABEL = { OPERATIVO:'Nodo B operativo', DEGRADADO:'Nodo B degradado', SIN_RESPUESTA:'NODO B SIN RESPUESTA', DESCONOCIDO:'Estado del nodo B desconocido' };
let lastOk = 0;

function rows(table, head, list) {
  table.innerHTML = '<tr>' + head.map(h => `<th>${h}</th>`).join('') + '</tr>' + list.join('');
}

function render(d) {
  const w = d.watchdog, nb = w.nodeB || {};
  $('node').textContent = '· ' + w.node;
  const b = $('banner');
  b.className = nb.state || '';
  b.innerHTML = esc(LABEL[nb.state] || nb.state) + (nb.since ? ` desde ${time(nb.since)} (${ago(nb.since)})` : '')
    + `<small>${esc(nb.summary)}</small>`;
  rows($('targets'), ['Servicio', 'Estado', 'Desde', 'Latencia', 'Detalle'], (w.targets || []).map(t =>
    `<tr><td>${esc(t.name)}</td><td>${pill(t.state)}</td><td>${time(t.since)}</td><td>${t.latencyMs == null ? '—' : t.latencyMs + ' ms'}</td><td>${esc(t.detail)}</td></tr>`));
  const k = w.kafka;
  $('kafka').innerHTML = k ? `Kafka ${pill(k.state)} ${esc(k.detail)}` : 'sin datos';
  rows($('groups'), ['Grupo', 'Consumidores (nodo)', 'Atraso', 'Situación'], (k && k.groups || []).map(g =>
    `<tr><td>${esc(g.group)}</td><td>${g.consumers.length ? esc(g.consumers.join(', ')) : '<span class="muted">ninguno</span>'}</td>`
    + `<td>${esc(g.lag)} ${g.trend !== '-' ? pill(g.trend) : ''}</td><td>${pill(g.condition)} <span class="muted">${esc(g.message)}</span></td></tr>`));
  const s = d.spool || {};
  rows($('spool'), ['', 'Críticos', 'Telemetría'], [
    ['Pendientes de enviar', 'pendientes'], ['Más antiguo (s)', 'masAntiguoSegundos'], ['Reenviados', 'reenviados'],
    ['Vencidos (>15 min)', 'vencidos'], ['Descartados por tope', 'descartadosPorTope'], ['Apartados (.rejected)', 'apartados'],
    ['Líneas inválidas', 'lineasInvalidas']].map(([label, key]) =>
    `<tr><td>${label}</td><td>${esc(s.critical && s.critical[key])}</td><td>${esc(s.telemetry && s.telemetry[key])}</td></tr>`));
  rows($('history'), ['Hora', 'Objetivo', 'Cambio', 'Detalle'], (w.transitions || []).slice(0, 20).map(t =>
    `<tr><td>${time(t.at)}</td><td>${esc(t.target)}</td><td>${pill(t.from)} → ${pill(t.to)}</td><td>${esc(t.detail)}</td></tr>`));
  const p = d.publisher || {};
  $('footer').textContent = `Kafka ${p.kafkaAceptaEnvios ? 'acepta' : 'NO acepta'} envíos · último envío confirmado ${time(p.ultimoEnvioConfirmado)} · revisado ${time(w.checkedAt)}`;
}

async function refresh() {
  try {
    const r = await fetch('api/watchdog', {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
    lastOk = Date.now();
  } catch (e) {
    const b = $('banner');
    b.className = '';
    b.innerHTML = 'Sin conexión con el simulador de este nodo' + (lastOk ? ` (último dato ${ago(new Date(lastOk))})` : '');
  }
}

$('resend').onclick = async () => {
  $('resendMsg').textContent = 'reintentando…';
  try { await fetch('api/simulator/spool/resend', {method: 'POST'}); $('resendMsg').textContent = 'listo'; refresh(); }
  catch (e) { $('resendMsg').textContent = 'falló'; }
};
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
